name: Vitest Tests

on:
  workflow_call:

jobs:
  vitest:
    name: Vitest Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: 'package.json'
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npx vitest run
